[package]
name = "ghostd"
version = "0.1.0"
edition = "2024"

[dependencies]
aa-types = { path = "../aa-types" }
policy = { path = "../policy" }
sim = { path = "../sim" }
permit = { path = "../permit" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-primitives = { version = "1.7", features = ["serde"] }
hex = "0.4"

[dev-dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
alloy-sol-types = "1.7"
